<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property details | P09 Estate</title>
  <link rel="stylesheet" href="/assets/vendor/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div id="app-navbar"></div>
  <main class="container py-4 py-lg-5">
    <div id="page-alert"></div>
    <div id="property-loading" class="text-center py-5"><div class="spinner-border" role="status"><span class="visually-hidden">Loading</span></div></div>
    <div id="property-detail" class="d-none">
      <div class="row g-4">
        <div class="col-lg-8">
          <div id="property-images"></div>
          <div class="card border-0 shadow-sm mt-4"><div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
              <div><div id="property-badges" class="d-flex gap-2 mb-2"></div><h1 id="property-title" class="h2 mb-2"></h1><p id="property-location" class="text-secondary mb-0"></p></div>
              <div class="text-lg-end"><p id="property-price" class="h3 mb-1"></p><span id="property-purpose" class="text-secondary"></span></div>
            </div>
            <hr>
            <div class="row g-3 mb-4">
              <div class="col-6 col-md-3"><span class="small text-secondary d-block">Bedrooms</span><strong id="property-bedrooms"></strong></div>
              <div class="col-6 col-md-3"><span class="small text-secondary d-block">Type</span><strong id="property-type"></strong></div>
              <div class="col-6 col-md-3"><span class="small text-secondary d-block">Listed</span><strong id="property-created"></strong></div>
              <div class="col-6 col-md-3"><span class="small text-secondary d-block">Updated</span><strong id="property-updated"></strong></div>
            </div>
            <h2 class="h5">Description</h2><p id="property-description" class="mb-4"></p>
            <a id="agent-profile-link" class="btn btn-outline-dark btn-sm" href="#">View agent profile and ratings</a>
          </div></div>
        </div>
        <aside class="col-lg-4">
          <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4">
            <h2 class="h5">Buyer and tenant actions</h2>
            <p id="action-note" class="small text-secondary">These actions are checked again by the backend.</p>
            <button id="save-button" class="btn btn-dark w-100 mb-3">Save to favourites</button>
            <form id="enquiry-form">
              <label class="form-label required" for="enquiry-message">Enquiry message</label>
              <textarea class="form-control mb-2" id="enquiry-message" rows="4" minlength="10" maxlength="2000" required placeholder="I would like to arrange a viewing..."></textarea>
              <button id="enquiry-button" class="btn btn-success w-100" type="submit">Submit enquiry</button>
            </form>
          </div></div>
          <div id="flag-card" class="card border-0 shadow-sm"><div class="card-body p-4">
            <h2 class="h6">Report this listing</h2>
            <form id="flag-form"><textarea class="form-control form-control-sm mb-2" id="flag-reason" minlength="10" maxlength="1000" required placeholder="Explain the issue"></textarea><button id="flag-button" class="btn btn-outline-danger btn-sm" type="submit">Flag listing</button></form>
          </div></div>
        </aside>
      </div>
    </div>
  </main>
  <script src="/assets/vendor/bootstrap.bundle.min.js"></script><script src="/assets/js/common.js"></script><script src="/assets/js/property.js"></script>
</body>
</html>
